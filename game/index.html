<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLOCK FALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <h1 class="title">BLOCK FALL</h1>
  <p class="subtitle">落ちモノパズル</p>

  <div class="layout">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="overlay" class="show">
        <div class="msg title" id="overlay-msg">BLOCK FALL</div>
        <div class="highscore-line">HIGH SCORE<span id="overlay-highscore-value">0</span></div>
        <div class="hint" id="overlay-hint">スタートボタンで開始</div>
        <button id="restart-btn">START</button>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <p class="panel-label">Next</p>
        <canvas id="next-canvas" width="100" height="100"></canvas>
      </div>

      <div class="panel">
        <p class="panel-label">High Score</p>
        <div class="stat-value" id="highscore">0</div>
      </div>

      <div class="panel">
        <p class="panel-label">Score</p>
        <div class="stat-value accent" id="score">0</div>
      </div>

      <div class="panel">
        <p class="panel-label">Level</p>
        <div class="stat-value" id="level">1</div>
      </div>

      <div class="panel">
        <p class="panel-label">Lines</p>
        <div class="stat-value" id="lines">0</div>
      </div>

      <div class="panel">
        <p class="panel-label">Controls</p>
        <div class="keys controls-desktop">
          <kbd>&larr; &rarr;</kbd><span>移動</span>
          <kbd>&darr;</kbd><span>ソフトドロップ</span>
          <kbd>&uarr;</kbd><span>ハードドロップ</span>
          <kbd>Space</kbd><span>回転</span>
          <kbd>P</kbd><span>一時停止</span>
        </div>
        <div class="keys controls-touch">
          <kbd>&larr; &rarr;</kbd><span>スワイプで移動</span>
          <kbd>&darr;</kbd><span>スワイプでドロップ</span>
          <kbd>TAP</kbd><span>タップで回転</span>
        </div>
      </div>
    </div>
  </div>

  <p class="footer-hint">横一列を揃えて消せ&nbsp;&mdash;&nbsp;積み上がったら終わり</p>
</div>

<script src="script.js"></script>
</body>
</html>
